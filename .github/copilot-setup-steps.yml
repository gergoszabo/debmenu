name: Copilot Setup
description: Pre-install dependencies for GitHub Copilot coding agent

steps:
  - name: Use .NET 11 SDK
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: "11.0.x"

  - name: Restore NuGet dependencies
    run: dotnet restore

  - name: Build the project
    run: dotnet build
